name: Sync upstream

# 定时把官方 zai-org/ZCode 的 main 合并进 fork。合并后先在 runner 上跑
# typecheck + lint 质量门，通过才推进 main（并触发 build-release 的 workflow_run）；
# 合并冲突或检查不通过都转成 PR 人工处理，避免 fork 定制代码被上游直接冲掉。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "zcode-fork-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/zai-org/ZCode.git
          git fetch upstream main

          ahead=$(git rev-list --count HEAD..upstream/main)
          echo "upstream ahead by $ahead commits"
          if [ "$ahead" -eq 0 ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            echo "merged=pending" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 冲突：放弃当前合并，改在独立分支上保留冲突现场并开 PR 人工处理。
          git merge --abort
          conflict_branch="sync-conflict/$(date +%Y%m%d%H%M%S)"
          git checkout -b "$conflict_branch"
          git merge --no-edit upstream/main || true
          git add -A
          git commit -m "chore: sync upstream (conflict state, resolve before merge)" || true
          git push origin "$conflict_branch"
          gh pr create \
            --base main \
            --head "$conflict_branch" \
            --title "上游同步冲突，需要人工解决" \
            --body "上游 zai-org/ZCode main 与 fork 存在冲突（含定制补丁：displayName、fork 更新源、CI workflow）。请解决冲突后合并；合并后手动触发 build-release。"
          echo "merged=false" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.merged == 'pending'
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.merged == 'pending'
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Verify merged tree (typecheck + lint)
        if: steps.merge.outputs.merged == 'pending'
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm typecheck
          pnpm lint

      - name: Push merged main
        if: steps.merge.outputs.merged == 'pending'
        run: |
          git push origin main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Open PR when checks fail
        if: failure() && steps.merge.outputs.merged == 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync-checks-failed/$(date +%Y%m%d%H%M%S)"
          git checkout -b "$branch"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "上游同步已合并但 typecheck/lint 未通过" \
            --body "合并结果在本 workflow 的 typecheck/lint 门上失败，已保留到本分支。请人工修复后合并；合并后手动触发 build-release。"
